ll="#c9d1dc"/><rect x="1096" y="273.0" width="192" height="8" rx="4" fill="#c9d1dc"/><rect x="1096" y="315.0" width="115.19999999999999" height="8" rx="4" fill="#c9d1dc"/><text x="1192" y="395" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#6b7280" text-anchor="middle" >prompt</text><path d="M820,412 L820,424 L1302,424 L1302,412" fill="none" stroke="#c9d1dc" stroke-width="2"/><text x="1061" y="452" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#3d4450" text-anchor="middle" >harmless, looks edgy</text><line x1="1320" y1="290" x2="1380" y2="290" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="1390" y="250" width="150" height="80" rx="12" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="1465" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1d21" text-anchor="middle" >MLLM</text><rect x="1390" y="350" width="150" height="70" rx="12" fill="#fdeeee" stroke="#e5a3a6" stroke-width="3"/><text x="1465.0" y="396.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#b4232a" text-anchor="middle" >“unsafe”  ✗</text><text x="1465" y="455" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b4232a" text-anchor="middle" >the model over-refuses</text><text x="40" y="560" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#3d4450" text-anchor="start" >GPT-4V on the benchmark</text><rect x="40" y="585" width="1520" height="92" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="40" y="585" width="548.72" height="92" rx="10" fill="#fdeeee" stroke="#e5a3a6" stroke-width="2"/><text x="60" y="641.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#3d4450" text-anchor="start" >unsafe inputs it calls safe</text><text x="1540" y="644.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#b4232a" text-anchor="end" >36.1%</text><rect x="40" y="695" width="1520" height="92" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="40" y="695" width="910.48" height="92" rx="10" fill="#fdf3dc" stroke="#e2c27a" stroke-width="2"/><text x="60" y="751.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#3d4450" text-anchor="start" >benign inputs it calls unsafe</text><text x="1540" y="754.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#8a5a00" text-anchor="end" >59.9%</text><rect x="40" y="830" width="1520" height="120" rx="14" fill="#f6f8fa" stroke="#c9d1dc" stroke-width="2"/><text x="70" y="878" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#3d4450" text-anchor="start" >The benchmark scores both failures separately. Three mitigations were then tested — prompting, visual</text><text x="70" y="916" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#3d4450" text-anchor="start" >contrastive decoding, and vision-centric reasoning fine-tuning — and none closed the gap.</text></svg>