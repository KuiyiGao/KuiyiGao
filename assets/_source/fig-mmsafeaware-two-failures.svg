<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#8a8f98"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><text x="40" y="74" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#1a1d21" text-anchor="start" >Safety awareness has two failure modes</text><text x="40" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#6b7280" text-anchor="start" >MMSafeAware · 1,500 image–prompt pairs · 29 safety scenarios · nine multimodal LLMs evaluated</text><text x="40" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1a1d21" text-anchor="start" >Unsafe pair</text><rect x="40" y="215" width="220" height="150" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><circle cx="106.0" cy="263.0" r="16.5" fill="#e2c27a"/><path d="M48,357 L123.6,290.0 L167.6,329.0 L198.4,305.0 L252,357 z" fill="#c9d1dc"/><text x="150" y="395" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#6b7280" text-anchor="middle" >image</text><text x="272" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="40" font-weight="400" fill="#6b7280" text-anchor="start" >+</text><rect x="302" y="215" width="220" height="150" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="316" y="231.0" width="192" height="8" rx="4" fill="#c9d1dc"/><rect x="316" y="273.0" width="192" height="8" rx="4" fill="#c9d1dc"/><rect x="316" y="315.0" width="115.19999999999999" height="8" rx="4" fill="#c9d1dc"/><text x="412" y="395" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#6b7280" text-anchor="middle" >prompt</text><path d=