<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="36" y="46" font-size="21" font-weight="700" fill="#111">Reported recall factorizes into three terms</text>
  <text x="36" y="72" font-size="14" fill="#555">65 malicious agent skills, replayed from stored runs.</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker></defs>
  <rect x="36" y="100" width="252" height="86" rx="6" fill="#eef2f6" stroke="#c9d4de"/>
  <text x="52" y="128" font-size="13" font-weight="700" fill="#111">P(execute)</text>
  <text x="52" y="150" font-size="12" fill="#555">does the skill run?</text>
  <text x="52" y="172" font-size="12" fill="#555">execution-depth ladder</text>
  <rect x="324" y="100" width="252" height="86" rx="6" fill="#fdecec" stroke="#e8b4b4"/>
  <text x="340" y="128" font-size="13" font-weight="700" fill="#a02020">P(observe | execute)</text>
  <text x="340" y="150" font-size="12" fill="#7a3030">does it emit anything a</text>
  <text x="340" y="170" font-size="12" fill="#7a3030">monitor can see?</text>
  <rect x="612" y="100" width="252" height="86" rx="6" fill="#eef2f6" stroke="#c9d4de"/>
  <text x="628" y="128" font-size="13" font-weight="700" fill="#111">P(detect | observed)</text>
  <text x="628" y="150" font-size="12" fill="#555">given evidence, does the</text>
  <text x="628" y="170" font-size="12" fill="#555">classifier call it?</text>
  <path d="M292 143 L318 143" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <path d="M580 143 L606 143" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="36" y="232" font-size="14" font-weight="700" fill="#111">Measured</text>
  <g font-size="13">
    <rect x="36" y="246" width="828" height="34" rx="4" fill="#f7f8fa" stroke="#e2e6ea"/>
    <text x="52" y="268" fill="#333">malicious skills replayed</text><text x="700" y="268" fill="#333" font-weight="700">65</text>
    <rect x="36" y="286" width="828" height="34" rx="4" fill="#fdecec" stroke="#e8b4b4"/>
    <text x="52" y="308" fill="#7a3030">produced no proxy-visible egress</text><text x="700" y="308" fill="#a02020" font-weight="700">46</text>
    <rect x="36" y="326" width="828" height="34" rx="4" fill="#f7f8fa" stroke="#e2e6ea"/>
    <text x="52" y="348" fill="#333">flagged by the runtime detector</text><text x="700" y="348" fill="#333" font-weight="700">0</text>
  </g>
</svg>
