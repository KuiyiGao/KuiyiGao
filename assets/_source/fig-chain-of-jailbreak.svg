fused</text><text x="40" y="380" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#3d4450" text-anchor="start" >As a chain of edits</text><rect x="40" y="400" width="330" height="210" rx="14" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="205" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="middle" >step 1 · generate</text><rect x="80" y="455" width="130" height="130" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="106.0" y="500.5" width="78.0" height="58.5" rx="8" fill="#c9d1dc"/><rect x="230" y="500" width="120" height="56" rx="12" fill="#eaf5ec" stroke="#9fcfae" stroke-width="3"/><text x="290.0" y="539.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2b7a3b" text-anchor="middle" >passes</text><line x1="380" y1="505" x2="460" y2="505" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="430" y="400" width="330" height="210" rx="14" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="595" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="middle" >step 2 · edit</text><rect x="470" y="455" width="130" height="130" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="496.0" y="500.5" width="78.0" height="58.5" rx="8" fill="#c9d1dc"/><circle cx="535.0" cy="494.0" r="18.200000000000003" fill="#e2c27a"/><rect x="620" y="500" width="120" height="56" rx="12" fill="#eaf5ec" stroke="#9fcfae" stroke-width="3"/><text x="680.0" y="539.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2b7a3b" text-anchor="middle" >passes</text><line x1="770" y1="505" x2="850" y2="505" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="820" y="400" width="330" height="210" rx="14" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="985" y="440" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="middle" >step 3 · edit</text><rect x="860" y="455" width="130" height="130" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="886.0" y="500.5" width="78.0" height="58.5" rx="8" fill="#c9d1dc"/><circle cx="925.0" cy="494.0" r="18.200000000000003" fill="#e2c27a"/><rect x="899.0" y="520.0" width="52.0" height="18.200000000000003" rx="6" fill="#e5a3a6"/><rect x="1010" y="500" width="120" height="56" rx="12" fill="#eaf5ec" stroke="#9fcfae" stroke-width="3"/><text x="1070.0" y="539.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2b7a3b" text-anchor="middle" >passes</text><line x1="1160" y1="505" x2="1240" y2="505" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="1250" y="400" width="310" height="210" rx="14" fill="#fdeeee" stroke="#e5a3a6" stroke-width="3"/><text x="1405" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#b4232a" text-anchor="middle" >composed result</text><text x="1405" y="515" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#b4232a" text-anchor="middle" >harmful</text><text x="1405" y="570" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#b4232a" text-anchor="middle" >no single step was refusable</text><text x="40" y="690" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#3d4450" text-anchor="start" >Bypass rate across the four services</text><rect x="40" y="712" width="990" height="78" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="40" y="712" width="594.0" height="78" rx="10" fill="#fdeeee" stroke="#e5a3a6" stroke-width="2"/><text x="60" y="761.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#3d4450" text-anchor="start" >Chain-of-Jailbreak</text><text x="1010" y="764.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#b4232a" text-anchor="end" >&gt; 60%</text><rect x="40" y="806" width="990" height="78" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="40" y="806" width="138.60000000000002" height="78" rx="10" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="60" y="855.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#3d4450" text-anchor="start" >prior jailbreak methods</text><text x="1010" y="858.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#3d4450" text-anchor="end" >14%</text><rect x="1060" y="712" width="500" height="172" rx="14" fill="#eaf5ec" stroke="#9fcfae" stroke-width="3"/><text x="1310" y="760" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2b7a3b" text-anchor="middle" >Think Twice Prompting</text><text x="1310" y="822" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#2b7a3b" text-anchor="middle" >&gt; 95%</text><text x="1310" y="862" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#2b7a3b" text-anchor="middle" >of attacks defended</text><text x="40" y="940" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#6b7280" text-anchor="start" >I designed the attack methodology, ran most of the attack and defense experiments, and wrote the paper.</text></svg>