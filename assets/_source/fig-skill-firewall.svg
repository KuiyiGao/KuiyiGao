<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#8a8f98"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><text x="40" y="74" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#1a1d21" text-anchor="start" >Agent Skill Firewall — runtime verification of agent skills</text><text x="40" y="122" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#6b7280" text-anchor="start" >Each PASS / DEFER / BLOCK verdict is recorded together with the evidence it was derived from</text><rect x="40" y="190" width="320" height="150" rx="16" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="64" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1d21" text-anchor="start" >Skill bundle</text><text x="64" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#3d4450" text-anchor="start" >manifest + code</text><line x1="368" y1="265" x2="412" y2="265" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="420" y="190" width="320" height="150" rx="16" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="444" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1d21" text-anchor="start" >Static pre-scan</text><text x="444" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#3d4450" text-anchor="start" >declared intent</text><line x1="748" y1="265" x2="792" y2="265" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="800" y="190" width="320" height="150" rx="16" fill="#fdf3dc" stroke="#e2c27a" stroke-width="2"/><text x="824" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#8a5a00" text-anchor="start" >Canary-seeded proxy</text><text x="824" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#8a5a00" text-anchor="start" >observed action + result</text><line x1="1128" y1="265" x2="1172" y2="265" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="1180" y="190" width="380" height="150" rx="16" fill="#eef1f5" stroke="#c9d1dc" stroke-width="2"/><text x="1204" y="250" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a1d21" text-anchor="start" >intent vs action vs result</text><text x="1204" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#3d4450" text-anchor="start" >verdict + evidence record</text><line x1="1370" y1="350" x2="1370" y2="410" stroke="#8a8f98" stroke-width="5" marker-end="url(#ah)"/><rect x="760" y="420" width="240" height="90" rx="12" fill="#eaf5ec" stroke="#9fcfae" stroke-width="3"/><text x="880.0" y="476.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2b7a3b" text-anchor="middle" >PASS</text><rect x="1030" y="420" width="240" height="90" rx="12" fill="#fdf3dc" stroke="#e2c27a" stroke-width="3"/><text x="1150.0" y="476.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#8a5a00" text-anchor="middle" >DEFER</text><rect x="1300" y="420" width="260" height="90" rx="12" fill="#fdeeee" stroke="#e5a3a6" stroke-width="3"/><text x="1430.0" y="476.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#b4232a" text-anchor="middle" >BLOCK</text><rect x="40" y="570" width="1520" height="380" rx="16" fill="#f6f8fa" stroke="#c9d1dc" stroke-width="2"/><text x="70" y="625" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#3d4450" text-anchor="start" >Then I measured whether the check is reached at all</text><text x="70" y="672" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#3d4450" text-anchor="start" >on stored runs of 65 malicious agent skills:</text><rect x="70" y="700" width="700" height="84" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="70" y="700" width="495.3846153846154" height="84" rx="10" fill="#fdf3dc" stroke="#e2c27a" stroke-width="2"/><text x="90" y="752.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#3d4450" text-anchor="start" >produced no proxy-visible egress</text><text x="750" y="755.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#8a5a00" text-anchor="end" >46 / 65</text><rect x="70" y="800" width="700" height="84" rx="10" fill="#f7f8fa" stroke="#c9d1dc" stroke-width="2"/><rect x="70" y="800" width="6" height="84" rx="10" fill="#fdeeee" stroke="#e5a3a6" stroke-width="2"/><text x="90" y="852.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#3d4450" text-anchor="start" >flagged by the runtime detector</text><text x="750" y="855.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#b4232a" text-anchor="end" >0 / 65</text><rect x="820" y="700" width="710" height="184" rx="14" fill="#fff" stroke="#c9d1dc" stroke-width="2"/><text x="1175" y="750" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#6b7280" text-anchor="middle" >reported recall factors as</text><text x="1175" y="800" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1a1d21" text-anchor="middle" >P(execute) · P(observe | execute) · P(detect | observed)</text><text x="1175" y="850" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#8a5a00" text-anchor="middle" >most of the loss is in the middle term</text><text x="70" y="925" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#6b7280" text-anchor="start" >Built with a four-student team at MBZUAI UGRIP 2026 — I built the runtime firewall; the measurement study is a manuscript in preparation.</text></svg>