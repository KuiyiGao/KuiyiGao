name: GitHub profile 3D contribution

# Manual only. The 3D calendar is not shown on the profile README any more —
# a daily-commit picture is the wrong signal for research output, and the
# action's bar height is a hardcoded log scale with no axis controls.
# Kept so it can be revived with one click from the Actions tab if wanted.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution calendar"
          git push
